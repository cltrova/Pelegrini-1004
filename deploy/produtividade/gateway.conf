server {
    listen 172.16.12.1:18881;
    server_name _;
    access_log off;
    location = /api/produtividade/diario {
        proxy_pass https://127.0.0.1:15004/operacional/produtividade/diario$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name pelegrini-produtividade;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/pelegrini-productivity/erp.crt;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host 189.112.3.29;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
